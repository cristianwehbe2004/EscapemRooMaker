services:
  frontend:
    image: node:20-bookworm-slim
    container_name: escaperoom-frontend
    working_dir: /workspace/src/frontend
    command: >
      bash -lc "npm install && CHOKIDAR_USEPOLLING=true HOST=0.0.0.0 REACT_APP_API_BASE_URL=${REACT_APP_API_BASE_URL:-http://16.16.202.96:5130} npm start"
    ports:
      - "3000:3000"
    volumes:
      - ..:/workspace
      - frontend_node_modules:/workspace/src/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    container_name: escaperoom-backend
    working_dir: /app
    command: ["dotnet", "EscapeRoom.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5130
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=escaperoom;Username=escaperoom;Password=escaperoom
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: escaperoom
      Jwt__Audience: escaperoom-clients
      Jwt__Key: replace-with-long-dev-secret-minimum-32-bytes
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: ${FRONTEND_ORIGIN:-http://16.16.202.96:3000}
      Database__ApplyMigrationsOnStartup: ${APPLY_MIGRATIONS_ON_STARTUP:-true}
      Database__SeedOnStartup: ${SEED_DATABASE_ON_STARTUP:-false}
    ports:
      - "5130:5130"
    volumes:
      - ../src/backend/EscapeRoom.Api/bin/Release/net10.0/publish:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/5130'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16
    container_name: escaperoom-postgres
    environment:
      POSTGRES_USER: escaperoom
      POSTGRES_PASSWORD: escaperoom
      POSTGRES_DB: escaperoom
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escaperoom -d escaperoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: escaperoom-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend_node_modules:
  pg_data:
  redis_data:
