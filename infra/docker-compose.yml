services:
  frontend:
    image: node:20-bullseye
    container_name: escaperoom-frontend
    working_dir: /app
    command: >
      bash -lc "npm install && CHOKIDAR_USEPOLLING=true HOST=0.0.0.0 npm start"
    ports:
      - "3000:3000"
    volumes:
      - ../src/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - postgres
      - redis
      - azurite

  postgres:
    image: postgres:16
    container_name: escaperoom-postgres
    environment:
      POSTGRES_USER: escaperoom
      POSTGRES_PASSWORD: escaperoom
      POSTGRES_DB: escaperoom
    ports:
      - "55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escaperoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: escaperoom-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: escaperoom-azurite
    command: "azurite-blob --blobHost 0.0.0.0 --location /data"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  frontend_node_modules:
  pg_data:
  redis_data:
  azurite_data:
